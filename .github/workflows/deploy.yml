name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  verify-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify Windows runtime socket and installation hand-off
        working-directory: launcher/windows
        run: go test -race ./...

  verify-macos-runtime:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Verify Mac update, lock takeover and Key isolation
        shell: bash
        run: |
          set -euo pipefail
          ONE_TEST_SDK=$(xcrun --sdk macosx --show-sdk-path)
          ONE_TEST_ARCH=$(uname -m)
          for suite in KeyDiscovery RuntimeInstallation RuntimeRecovery ResidentTakeover CodexRuntime MacLocalFiles; do
            xcrun swiftc -sdk "$ONE_TEST_SDK" -target "$ONE_TEST_ARCH-apple-macosx13.0" -parse-as-library \
              "launcher/macos/$suite.swift" "launcher/macos/${suite}Tests.swift" \
              -o "$RUNNER_TEMP/one-$suite-tests"
            "$RUNNER_TEMP/one-$suite-tests"
          done
          xcrun swiftc -sdk "$ONE_TEST_SDK" -target "$ONE_TEST_ARCH-apple-macosx13.0" -parse-as-library \
            launcher/macos/ResidentTakeover.swift launcher/macos/MachineResident.swift launcher/macos/MachineResidentTests.swift \
            -o "$RUNNER_TEMP/one-machine-tests"
          "$RUNNER_TEMP/one-machine-tests"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: [verify, verify-windows-runtime, verify-macos-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure restricted SSH access
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package source
        run: |
          git archive --format=tar --output=/tmp/one-${GITHUB_SHA}.tar HEAD

      - name: Deploy source package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA" < "/tmp/one-${GITHUB_SHA}.tar"
